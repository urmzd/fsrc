[output]
dir = "./showcase"

[[output.formats]]
output_type = "png"

[[scenes]]
type = "web"
name = "before"
uri = "showcase/demo/README.md"
theme = "dark"
full_page = true
viewport = { width = 800, height = 260 }

[[scenes]]
type = "web"
name = "after"
uri = "showcase/demo/README.after.md"
theme = "dark"
full_page = true
viewport = { width = 800, height = 260 }

[[scenes]]
type = "terminal"
name = "run"
theme = "dracula"
cols = 52
rows = 4
formats = [{ output_type = "png" }]

[[scenes.interactions]]
type = "type"
text = "cd showcase/demo"
hidden = true

[[scenes.interactions]]
type = "key"
key = "enter"
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 300
hidden = true

[[scenes.interactions]]
type = "type"
text = "export PS1='$ ' && clear"
hidden = true

[[scenes.interactions]]
type = "key"
key = "enter"
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 300
hidden = true

[[scenes.interactions]]
type = "type"
text = "fsrc run README.md -o README.after.md"
speed = 40

[[scenes.interactions]]
type = "key"
key = "enter"

[[scenes.interactions]]
type = "wait"
duration = 1500
